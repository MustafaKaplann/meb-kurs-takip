name: Check MEB Courses

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Sadece Telegram test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-courses
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Telegram test
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --test-telegram

      - name: Kursları kontrol et
        if: ${{ !inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: State dosyasını kaydet
        if: ${{ !inputs.test_telegram }}
        run: |
          if git diff --quiet seen_courses.json; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_courses.json
          git commit -m "chore: update seen courses"
          git push
